<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Packs - Dragon TUC</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar" id="navbar"></nav>

<main class="container">
    <div class="section-title"><h2>💎 𝐃𝐈𝐀𝐌𝐎𝐍𝐃 𝐏𝐀𝐂𝐊𝐒</h2></div>
    
    <div class="pack-grid" id="packGrid"></div>
</main>

<div id="footer"></div>

<div class="music-bar" id="musicBar">
    <div class="music-line">
        <div class="music-title" id="musicTitle">🎵 𝐃𝐫𝐚𝐠𝐨𝐧 𝐓𝐔𝐂 𝐌𝐮𝐬𝐢𝐜</div>
        <div class="music-progress"></div>
    </div>
    <button class="music-btn-play" id="musicPlayBtn">▶</button>
    <button class="music-btn-stop" id="musicStopBtn">■</button>
</div>

<nav class="bottom-nav" id="bottomNav"></nav>

<script src="js/packs.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const grid = document.getElementById('packGrid');
    grid.innerHTML = PACKS.map(pack => `
        <div class="pack" onclick="selectPack('${pack.id}')">
            ${pack.badge ? `<div class="pack-badge ${pack.badge}">${pack.badge.toUpperCase()}</div>` : ''}
            <img src="${pack.image}" alt="${pack.name}" onerror="this.src='images/logo.jpg'">
            <div class="pack-name">${pack.name}</div>
            <div class="pack-amount">${pack.amount}</div>
            <div class="pack-price">${pack.price}</div>
        </div>
    `).join('');
});

function selectPack(packId) {
    const pack = PACKS.find(p => p.id === packId);
    if (!pack) return;
    localStorage.setItem('dragontuc_selected_pack', JSON.stringify(pack));
    window.location.href = 'order.html';
}
</script>

</body>
</html>
